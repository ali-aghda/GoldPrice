name: Check Gold Price

on:
  schedule:
    # اجرا در دقیقه‌های 0، 20 و 40 در هر ساعت
    - cron: '0,20,40 * * * *'
  workflow_dispatch: # امکان اجرای دستی برای تست

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pkg_resources || pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit and push if price changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git status
          git add last_price.txt prices.json
          git diff --staged --quiet || (git commit -m "Update prices and cache [skip ci]" && git push)
